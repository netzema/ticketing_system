<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101712">
  <title>DJ Leo - Anmeldung</title>
  <style>
    * { box-sizing:border-box; }
    body {
      display:grid;
      min-height:100vh;
      min-height:100dvh;
      margin:0;
      place-items:center;
      padding:22px;
      background:radial-gradient(circle at 50% 10%, #294332 0, #101712 52%, #090e0a 100%);
      color:#f8faf8;
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width:min(100%, 400px); }
    .badge { color:#82df9e; font-size:.75rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:11px 0 9px; font-size:2.5rem; letter-spacing:-.045em; }
    p { margin:0 0 28px; color:#aeb8b0; line-height:1.5; }
    form { padding:22px; border:1px solid rgba(255,255,255,.12); border-radius:20px; background:rgba(255,255,255,.055); box-shadow:0 22px 60px rgba(0,0,0,.22); }
    label { display:block; margin-bottom:9px; font-size:.84rem; font-weight:750; }
    input[type="password"] { width:100%; min-height:56px; padding:0 15px; border:1px solid rgba(255,255,255,.17); border-radius:14px; outline:none; background:rgba(0,0,0,.23); color:#fff; font:inherit; }
    input[type="password"]:focus { border-color:#82df9e; box-shadow:0 0 0 4px rgba(130,223,158,.12); }
    button { width:100%; min-height:54px; margin-top:12px; border:0; border-radius:14px; background:#82df9e; color:#102117; font:inherit; font-weight:850; cursor:pointer; }
    button:disabled, input:disabled { opacity:.5; cursor:not-allowed; }
    .error { margin:0 0 14px; padding:11px 12px; border-radius:11px; background:rgba(255,105,97,.13); color:#ffc2bd; font-size:.85rem; }
    footer { margin-top:24px; color:#6e7a70; font-size:.69rem; text-align:center; }
    footer strong { color:#8d998f; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Oktoberfest 2026</span>
    <h1>Hallo Leo</h1>
    <p>Melde dich an, um Musikwünsche zu verwalten.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <label for="password">DJ-Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus {% if not configured %}disabled{% endif %} required>
      <button type="submit" {% if not configured %}disabled{% endif %}>Anmelden</button>
    </form>
    <footer>Technik von <strong>Netzl Data Solutions</strong></footer>
  </main>
</body>
</html>
