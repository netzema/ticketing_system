<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musikwunsch - QR-Code</title>
  <style>
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:28px; background:#e9ede9; color:#152319; font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { display:flex; flex-direction:column; width:min(100%, 520px); min-height:720px; margin:0 auto; align-items:center; justify-content:center; padding:42px; border-radius:28px; background:#fff; box-shadow:0 20px 60px rgba(19,35,25,.14); text-align:center; }
    .event { color:#4e9b64; font-size:.78rem; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:15px 0 12px; font-size:3.1rem; line-height:1; letter-spacing:-.05em; }
    .lead { margin:0; color:#526157; font-size:1.05rem; line-height:1.5; }
    img { display:block; width:min(76vw, 320px); height:auto; margin:28px auto 20px; image-rendering:pixelated; }
    .scan { margin:0; font-size:1.15rem; font-weight:850; }
    .time { margin:13px 0 0; color:#657269; font-size:.9rem; line-height:1.45; }
    .note { margin:12px 0 0; color:#7a857d; font-size:.78rem; }
    footer { margin-top:30px; color:#98a099; font-size:.66rem; }
    .controls { width:min(100%, 520px); margin:16px auto 0; text-align:center; }
    button { min-height:46px; padding:0 20px; border:0; border-radius:12px; background:#173821; color:#fff; font:inherit; font-weight:750; cursor:pointer; }
    @media print {
      @page { size:A6 portrait; margin:0; }
      body { min-height:0; padding:0; background:#fff; }
      .card { width:105mm; min-height:148mm; padding:12mm; border-radius:0; box-shadow:none; }
      h1 { font-size:30pt; }
      img { width:65mm; margin:7mm auto 4mm; }
      .controls { display:none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="event">Oktoberfest 2026</span>
    <h1>Dein Musikwunsch</h1>
    <p class="lead">Scanne den QR-Code und schick deinen Wunschtitel an DJ Leo.</p>
    <img src="{{ url_for('music_request_qr_code') }}" alt="QR-Code für Musikwünsche">
    <p class="scan">Scannen und wünschen</p>
    <p class="time">DJ Leo übernimmt ab ca. 01:30 Uhr.</p>
    <p class="note">Es besteht keine Garantie, dass dein Wunsch gespielt wird.</p>
    <footer>Technik von Netzl Data Solutions</footer>
  </main>
  <div class="controls"><button type="button" onclick="window.print()">Drucken</button></div>
</body>
</html>
