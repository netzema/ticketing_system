<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>Ticket-Scanner - Jugend Göttlesbrunn</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <style>
    :root {
      color-scheme:dark;
      --green:#38d878;
      --teal:#35d0c5;
      --red:#ff5d5d;
      --amber:#ffc857;
      --panel:rgba(8, 15, 11, 0.86);
    }

    * { box-sizing:border-box; }
    html, body { width:100%; min-height:100%; }
    body {
      margin:0;
      overflow:hidden;
      background:#07110b;
      color:#fff;
      font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    #scanner {
      position:fixed;
      inset:0;
      min-height:100vh;
      min-height:100dvh;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 42%, #21372a 0, #0a160f 58%, #050906 100%);
    }

    video {
      position:absolute;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#07110b;
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display:none !important;
      -webkit-appearance:none;
    }

    #shade {
      position:absolute;
      inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.56) 0%, rgba(0,0,0,.05) 27%, rgba(0,0,0,.08) 65%, rgba(0,0,0,.68) 100%);
      pointer-events:none;
    }

    #topbar {
      position:fixed;
      z-index:4;
      top:0;
      left:0;
      right:0;
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr);
      align-items:center;
      gap:12px;
      min-height:64px;
      padding:max(10px, env(safe-area-inset-top)) 14px 10px;
      background:#fff;
      color:#142018;
      box-shadow:0 5px 24px rgba(0,0,0,.22);
      text-align:left;
    }

    .brand-logo {
      display:flex;
      justify-self:start;
      width:112px;
      align-items:center;
    }

    .brand-logo img { display:block; width:100%; height:auto; }

    #ticket-counter {
      display:flex;
      grid-column:2;
      flex-direction:column;
      align-items:center;
      justify-self:center;
      min-width:64px;
      color:#142018;
      font-variant-numeric:tabular-nums;
      line-height:1;
    }

    #scanned-count { font-size:1.38rem; font-weight:850; }
    #ticket-counter span { margin-top:3px; color:#68736c; font-size:.62rem; font-weight:760; letter-spacing:.04em; text-transform:uppercase; }

    .delay-control {
      display:flex;
      grid-column:3;
      align-items:center;
      justify-self:end;
      gap:6px;
      color:#5a655e;
      font-size:.69rem;
      font-weight:720;
      white-space:nowrap;
    }

    .delay-control select {
      min-height:36px;
      padding:0 8px;
      border:1px solid #d9dfdb;
      border-radius:10px;
      outline:none;
      background:#f3f6f4;
      color:#142018;
      font:inherit;
      font-size:.76rem;
      font-weight:780;
    }

    .delay-control select:focus { border-color:#70b646; box-shadow:0 0 0 3px rgba(112,182,70,.18); }

    #scan-window {
      position:absolute;
      top:47%;
      left:50%;
      width:min(88vw, 62dvh, 480px);
      aspect-ratio:1;
      transform:translate(-50%, -50%);
      border:2px solid rgba(255,255,255,.88);
      border-radius:24px;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.48),
        0 10px 45px rgba(0,0,0,.28),
        inset 0 0 0 1px rgba(0,0,0,.1);
      transition:border-color .18s ease, box-shadow .18s ease;
      pointer-events:none;
    }

    #scan-window::before,
    #scan-window::after {
      content:"";
      position:absolute;
      width:54px;
      height:54px;
      border-color:#fff;
      border-style:solid;
    }

    #scan-window::before {
      top:-4px;
      left:-4px;
      border-width:5px 0 0 5px;
      border-radius:25px 0 0 0;
    }

    #scan-window::after {
      right:-4px;
      bottom:-4px;
      border-width:0 5px 5px 0;
      border-radius:0 0 25px 0;
    }

    #scan-window.valid {
      border-color:var(--green);
      box-shadow:0 0 0 9999px rgba(0,0,0,.54), 0 0 34px rgba(56,216,120,.48);
    }

    #scan-window.invalid {
      border-color:var(--red);
      box-shadow:0 0 0 9999px rgba(0,0,0,.54), 0 0 34px rgba(255,93,93,.42);
    }

    #scan-window.recent {
      border-color:var(--teal);
      box-shadow:0 0 0 9999px rgba(0,0,0,.54), 0 0 34px rgba(53,208,197,.46);
    }

    #scan-window.used,
    #scan-window.warning {
      border-color:var(--amber);
      box-shadow:0 0 0 9999px rgba(0,0,0,.54), 0 0 34px rgba(255,200,87,.42);
    }

    #scan-window.valid::before, #scan-window.valid::after { border-color:var(--green); }
    #scan-window.recent::before, #scan-window.recent::after { border-color:var(--teal); }
    #scan-window.used::before, #scan-window.used::after,
    #scan-window.warning::before, #scan-window.warning::after { border-color:var(--amber); }
    #scan-window.invalid::before, #scan-window.invalid::after { border-color:var(--red); }

    #hint {
      position:absolute;
      top:calc(100% + 14px);
      left:50%;
      width:max-content;
      max-width:88vw;
      transform:translateX(-50%);
      color:rgba(255,255,255,.88);
      font-size:.96rem;
      font-weight:650;
      letter-spacing:.01em;
      text-shadow:0 2px 12px #000;
    }

    #status {
      position:fixed;
      z-index:5;
      left:50%;
      bottom:max(18px, env(safe-area-inset-bottom));
      display:flex;
      align-items:center;
      gap:12px;
      width:calc(100% - 32px);
      max-width:540px;
      min-height:68px;
      padding:12px 16px;
      transform:translateX(-50%);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      background:var(--panel);
      box-shadow:0 12px 34px rgba(0,0,0,.3);
      text-align:left;
      backdrop-filter:blur(16px);
    }

    #status-icon {
      display:grid;
      flex:0 0 38px;
      place-items:center;
      width:38px;
      height:38px;
      border-radius:50%;
      background:rgba(255,255,255,.1);
      font-size:1.15rem;
      font-weight:900;
    }

    #status-copy { min-width:0; }
    #status-title { display:block; font-size:1.05rem; font-weight:780; line-height:1.15; }
    #status-detail { display:block; margin-top:4px; color:rgba(255,255,255,.68); font-size:.79rem; line-height:1.2; }
    #status.valid #status-icon { background:var(--green); color:#062612; }
    #status.recent #status-icon { background:var(--teal); color:#052725; }
    #status.used #status-icon { background:var(--amber); color:#302000; }
    #status.invalid #status-icon { background:var(--red); color:#310707; }
    #status.warning #status-icon { background:var(--amber); color:#302000; }

    @media (max-height:620px) {
      #scan-window { top:44%; width:min(76vw, 58dvh, 420px); }
      #hint { font-size:.82rem; }
      #status { min-height:58px; padding:9px 13px; }
    }

    @media (max-width:370px) {
      #topbar { gap:8px; padding-left:10px; padding-right:10px; }
      .brand-logo { width:96px; }
    }
  </style>
</head>
<body data-scanner-version="{{ scanner_version }}">
  <header id="topbar" aria-label="Scanner-Einstellungen">
    <span class="brand-logo"><img src="/static/netzl-logo.svg" alt="Netzl Data Solutions"></span>
    <div id="ticket-counter" aria-live="polite" aria-atomic="true">
      <strong id="scanned-count">{{ scanned_count }}</strong>
      <span>gescannt</span>
    </div>
    <label class="delay-control" for="scan-delay">
      Pause
      <select id="scan-delay" aria-label="Zeit zwischen zwei Scans">
        <option value="1000">1,0 s</option>
        <option value="1500" selected>1,5 s</option>
        <option value="2000">2,0 s</option>
        <option value="3000">3,0 s</option>
        <option value="5000">5,0 s</option>
      </select>
    </label>
  </header>

  <main id="scanner">
    <video id="video" autoplay muted playsinline disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>
    <div id="shade"></div>
    <div id="scan-window">
      <div id="hint">QR-Code in den Rahmen halten</div>
    </div>
  </main>

  <div id="status" role="status" aria-live="assertive">
    <span id="status-icon" aria-hidden="true">…</span>
    <span id="status-copy">
      <strong id="status-title">Kamera wird gestartet</strong>
      <small id="status-detail">Bitte Kamerazugriff erlauben</small>
    </span>
  </div>

  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
  <script>
    const video = document.getElementById("video");
    const scanWindow = document.getElementById("scan-window");
    const status = document.getElementById("status");
    const statusIcon = document.getElementById("status-icon");
    const statusTitle = document.getElementById("status-title");
    const statusDetail = document.getElementById("status-detail");
    const scanDelay = document.getElementById("scan-delay");
    const scannedCount = document.getElementById("scanned-count");
    const codeReader = new ZXing.BrowserQRCodeReader();
    let scanningEnabled = false;
    const delayStorageKey = "oktoberfest-scanner-delay-ms";

    function loadScanDelay() {
      try {
        const savedDelay = localStorage.getItem(delayStorageKey);
        if (savedDelay && scanDelay.querySelector(`option[value="${savedDelay}"]`)) {
          scanDelay.value = savedDelay;
        }
      } catch (error) {
        console.warn("Scanpause konnte nicht geladen werden", error);
      }
    }

    function getScanDelay() {
      return Number(scanDelay.value) || 1500;
    }

    scanDelay.addEventListener("change", () => {
      try {
        localStorage.setItem(delayStorageKey, scanDelay.value);
      } catch (error) {
        console.warn("Scanpause konnte nicht gespeichert werden", error);
      }
    });

    loadScanDelay();

    function setStatus(type, icon, title, detail) {
      status.className = type;
      scanWindow.className = ["valid", "recent", "used", "invalid", "warning"].includes(type) ? type : "";
      statusIcon.textContent = icon;
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
    }

    // Map ZXing's native video coordinates to the visible, cropped
    // object-fit: cover area and only accept codes fully inside the frame.
    function isInsideScanWindow(result) {
      const points = result.getResultPoints ? result.getResultPoints() : [];
      if (!points || points.length < 3 || !video.videoWidth || !video.videoHeight) {
        return false;
      }

      const videoRect = video.getBoundingClientRect();
      const windowRect = scanWindow.getBoundingClientRect();
      const scale = Math.max(
        videoRect.width / video.videoWidth,
        videoRect.height / video.videoHeight
      );
      const renderedWidth = video.videoWidth * scale;
      const renderedHeight = video.videoHeight * scale;
      const offsetX = (videoRect.width - renderedWidth) / 2;
      const offsetY = (videoRect.height - renderedHeight) / 2;

      return points.every(point => {
        const x = typeof point.getX === "function" ? point.getX() : point.x;
        const y = typeof point.getY === "function" ? point.getY() : point.y;
        const screenX = videoRect.left + offsetX + x * scale;
        const screenY = videoRect.top + offsetY + y * scale;
        return screenX >= windowRect.left && screenX <= windowRect.right &&
               screenY >= windowRect.top && screenY <= windowRect.bottom;
      });
    }

    function formatAge(seconds) {
      if (seconds < 5) return "Gerade eben";
      if (seconds < 60) return "Vor wenigen Sekunden";
      if (seconds < 120) return "Vor 1 Minute";
      if (seconds < 3600) return `Vor ${Math.floor(seconds / 60)} Minuten`;
      const hours = Math.floor(seconds / 3600);
      return hours === 1 ? "Vor 1 Stunde" : `Vor ${hours} Stunden`;
    }

    function showValidationResult(result) {
      if (Number.isInteger(result.count)) {
        scannedCount.textContent = result.count;
      }

      if (result.status === "valid") {
        const count = result.count ? `Bereits eingescannt: ${result.count}` : "Einlass freigeben";
        setStatus("valid", "✓", "Ticket gültig", count);
      } else if (result.status === "recent") {
        setStatus(
          "recent",
          "↻",
          "Soeben validiert",
          `${formatAge(result.age_seconds)} - ${result.scanned_time} Uhr`
        );
      } else if (result.status === "already_used") {
        setStatus(
          "used",
          "!",
          "Bereits validiert",
          `${formatAge(result.age_seconds)} - ${result.scanned_time} Uhr`
        );
      } else {
        setStatus("invalid", "×", "Ungültiges Ticket", "Ticket bitte kontrollieren");
      }
    }

    function refreshScanCount() {
      fetch("/api/scan-count", { cache: "no-store" })
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then(result => {
          if (Number.isInteger(result.count)) {
            scannedCount.textContent = result.count;
          }
        })
        .catch(error => console.warn("Scan-Zähler konnte nicht aktualisiert werden", error));
    }

    setInterval(() => {
      if (!document.hidden) refreshScanCount();
    }, 5000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshScanCount();
    });

    codeReader.decodeFromVideoDevice(null, video, (result) => {
      if (result && scanningEnabled && isInsideScanWindow(result)) {
        scanningEnabled = false;
        const parts = result.text.split("/");
        const ticketId = parts[parts.length - 1];

        setStatus("", "…", "Ticket wird geprüft", "Einen Moment bitte");

        fetch(`/validate/${encodeURIComponent(ticketId)}`, {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        })
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then(showValidationResult)
          .catch(() => {
            setStatus("warning", "!", "Keine Verbindung", "Internetverbindung prüfen");
          })
          .finally(() => {
            setTimeout(() => {
              setStatus("", "⌗", "Bereit zum Scannen", "Nächstes Ticket in den Rahmen halten");
              scanningEnabled = true;
            }, getScanDelay());
          });
      }
    })
    .then(() => {
      setStatus("", "⌗", "Bereit zum Scannen", "Ticket vollständig im Rahmen positionieren");
      scanningEnabled = true;
    })
    .catch(error => {
      console.error(error);
      setStatus("warning", "!", "Kamera nicht verfügbar", "Berechtigung und Browser prüfen");
    });
  </script>
</body>
</html>
